# DWG→DXF 変換ページ（dwg.jigcad.jp、前のアドレス dwg.toshiji.com）。静的ファイルだけを配信し、変換はすべて見る人のブラウザの中で行う
name = "dwg-to-dxf"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = false

routes = [
  { pattern = "dwg.toshiji.com", custom_domain = true },
  { pattern = "dwg.jigcad.jp", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
# 入口だけ先に worker を通す (/embed・/handoff は前のアドレスの JIGCAD が使うので、ファイルをそのまま返す)
run_worker_first = ["/", "/sitemap.xml"]
