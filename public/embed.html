<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>DWG→DXF 変換（埋め込み用）</title>
  </head>
  <body>
    <!-- WebCAD などのページから、見えない枠で呼ばれる変換係。
         呼んだページから DWG を受け取り、このパソコンの中で DXF にして返す。図面はどこにも送らない -->
    <script type="module">
      // 受け付ける呼び出し元 (知らないサイトから使われないように)
      const ALLOW = ['https://cad.toshiji.com', 'http://127.0.0.1:8780', 'http://localhost:8780'];
      const parentOrigin = (location.ancestorOrigins && location.ancestorOrigins[0]) || (() => { try { return new URL(document.referrer).origin; } catch { return ''; } })();
      if (!ALLOW.includes(parentOrigin)) throw new Error('not allowed: ' + parentOrigin);

      let worker, seq = 0;
      const mk = () => (worker = new Worker('./convert-worker.js', { type: 'module' }));
      mk();
      function convert(buf) {
        const id = ++seq, w = worker;
        return new Promise(res => {
          const done = d => { w.removeEventListener('message', on); w.removeEventListener('error', bad); res(d); };
          const on = e => { if (e.data.id === id) done(e.data); };
          const bad = () => done({ id, ok: false, err: -1 });
          w.addEventListener('message', on);
          w.addEventListener('error', bad);
          w.postMessage({ id, buf }, buf ? [buf] : []);
        });
      }

      // 1 件ずつ順番に変換する
      let queue = Promise.resolve();
      addEventListener('message', e => {
        if (e.origin !== parentOrigin || !e.data || e.data.type !== 'dwg2dxf') return;
        const { id, buf } = e.data;
        queue = queue.then(async () => {
          const r = await convert(buf);
          if (!r.ok && r.err === -1) { worker.terminate(); mk(); }
          const msg = { type: 'dwg2dxf-result', id, ok: r.ok, err: r.err };
          if (r.ok) { msg.dxf = r.dxf; parent.postMessage(msg, parentOrigin, [r.dxf.buffer]); }
          else parent.postMessage(msg, parentOrigin);
        });
      });

      // 変換係の準備ができたら知らせる
      convert(null).then(() => parent.postMessage({ type: 'dwg2dxf-ready' }, parentOrigin));
    </script>
  </body>
</html>
